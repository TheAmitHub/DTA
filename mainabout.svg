
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" fill="none">
<defs>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#C084FC"/><stop offset="1" stop-color="#6B21A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#9333EA"/><stop offset="1" stop-color="#4C1D95"/>
  </linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0E7FF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#55218A" flood-opacity=".18"/>
  </filter>
  <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
</defs>

<!-- Background -->
<ellipse cx="340" cy="275" rx="260" ry="215" fill="#DCC5FF" opacity=".4" filter="url(#glow)"/>
<circle cx="340" cy="275" r="220" stroke="#C4A3F5" stroke-dasharray="5 10" opacity=".7"/>
<circle cx="340" cy="275" r="165" stroke="#D8B4FE" stroke-dasharray="3 10" opacity=".65"/>

<!-- Orbit dots -->
<g fill="#9333EA">
  <circle cx="100" cy="135" r="5"/>
  <circle cx="570" cy="135" r="5"/>
  <circle cx="580" cy="390" r="6"/>
  <circle cx="100" cy="400" r="4"/>
  <circle cx="340" cy="48" r="4"/>
</g>

<!-- Central DTA logo hub -->
<g class="hub" filter="url(#shadow)">
  <circle cx="340" cy="265" r="115" fill="#2E1065"/>
  <circle cx="340" cy="254" r="108" fill="url(#deep)"/>
  <circle cx="340" cy="254" r="91" fill="url(#light)"/>
  <circle cx="340" cy="254" r="82" stroke="#D8B4FE" stroke-width="2"/>

  <!-- Clean DTA letters -->
  <text x="340" y="271"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="65"
        font-weight="900"
        letter-spacing="1"
        fill="#6B21A8">DTA</text>

  <!-- Brand underline -->
  <rect x="290" y="285" width="100" height="4" rx="2" fill="#C084FC"/>

  <!-- Full brand name -->
  <text x="340" y="310"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="700"
        letter-spacing="1.2"
        fill="#4C1D95">DIGITAL TECH ASSIST</text>
</g>

<!-- Team card -->
<g class="team" filter="url(#shadow)">
  <rect x="22" y="65" width="190" height="125" rx="20" fill="white"/>
  <circle cx="65" cy="107" r="22" fill="#F3E8FF"/>
  <circle cx="65" cy="99" r="8" fill="#9333EA"/>
  <path d="M49 123Q49 107 65 107Q81 107 81 123" fill="url(#purple)"/>
  <circle cx="91" cy="104" r="7" fill="#C084FC"/>
  <path d="M81 124Q82 111 94 112Q103 113 105 124" fill="#A855F7"/>
  <text x="117" y="103" font-size="12" font-weight="700" fill="#4C1D95">OUR TEAM</text>
  <text x="117" y="119" font-size="10" fill="#7E22CE">Working Together</text>
  <rect x="44" y="150" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="44" y="163" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Digital solutions card -->
<g class="services" filter="url(#shadow)">
  <rect x="468" y="65" width="190" height="125" rx="20" fill="white"/>
  <circle cx="510" cy="107" r="22" fill="#F3E8FF"/>
  <rect x="496" y="94" width="28" height="25" rx="5" fill="url(#purple)"/>
  <path d="M502 101H518M502 107H514M502 113H516" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="543" y="103" font-size="12" font-weight="700" fill="#4C1D95">DIGITAL</text>
  <text x="543" y="119" font-size="12" font-weight="700" fill="#4C1D95">SOLUTIONS</text>
  <rect x="490" y="150" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="490" y="163" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Client support card -->
<g class="support" filter="url(#shadow)">
  <rect x="15" y="330" width="195" height="120" rx="20" fill="white"/>
  <circle cx="58" cy="371" r="23" fill="#F3E8FF"/>
  <path d="M43 370Q43 352 58 352Q73 352 73 370V379H67V366Q67 357 58 357Q49 357 49 366V379H43Z" fill="url(#purple)"/>
  <rect x="41" y="368" width="9" height="16" rx="4" fill="#9333EA"/>
  <rect x="66" y="368" width="9" height="16" rx="4" fill="#9333EA"/>
  <path d="M72 384Q69 392 58 392" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/>
  <text x="92" y="367" font-size="12" font-weight="700" fill="#4C1D95">CLIENT</text>
  <text x="92" y="383" font-size="12" font-weight="700" fill="#4C1D95">SUPPORT</text>
  <rect x="37" y="410" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="37" y="423" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Shared growth card -->
<g class="growth" filter="url(#shadow)">
  <rect x="470" y="330" width="195" height="120" rx="20" fill="white"/>
  <circle cx="513" cy="371" r="23" fill="#F3E8FF"/>
  <path d="M498 382L508 369L516 375L530 357" stroke="#7E22CE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M519 357H530V368" stroke="#7E22CE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="548" y="367" font-size="12" font-weight="700" fill="#4C1D95">SHARED</text>
  <text x="548" y="383" font-size="12" font-weight="700" fill="#4C1D95">GROWTH</text>
  <rect x="492" y="410" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="492" y="423" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Mission card -->
<g class="mission" filter="url(#shadow)">
  <rect x="240" y="455" width="200" height="85" rx="19" fill="white"/>
  <circle cx="278" cy="493" r="23" fill="#F3E8FF"/>
  <path d="M278 478L283 488L294 493L283 498L278 508L273 498L262 493L273 488Z" fill="url(#purple)"/>
  <text x="311" y="486" font-size="12" font-weight="700" fill="#4C1D95">OUR MISSION</text>
  <text x="311" y="502" font-size="10" fill="#7E22CE">Making Digital Work Easier</text>
  <rect x="311" y="513" width="100" height="5" rx="2.5" fill="#D8B4FE"/>
</g>

<!-- Connection lines -->
<g stroke="#B98AEF" stroke-width="1.5" stroke-dasharray="4 6" opacity=".7">
  <path d="M205 170L255 205"/>
  <path d="M475 170L425 205"/>
  <path d="M210 360L250 325"/>
  <path d="M470 360L430 325"/>
</g>

<!-- Sparkles -->
<g fill="#9333EA">
  <path d="M275 45L281 63L299 69L281 75L275 93L269 75L251 69L269 63Z"/>
  <path d="M570 220L575 234L589 239L575 244L570 258L565 244L551 239L565 234Z"/>
  <path d="M110 465L115 479L129 484L115 489L110 503L105 489L91 484L105 479Z"/>
</g>

<style>
.hub { animation: hubFloat 4.5s ease-in-out infinite; transform-origin:center; }
.team { animation: float 4s ease-in-out infinite -1s; }
.services { animation: float 4.5s ease-in-out infinite -2s; }
.support { animation: float 4.2s ease-in-out infinite -1.5s; }
.growth { animation: float 4.5s ease-in-out infinite -.5s; }
.mission { animation: float 4s ease-in-out infinite -2.5s; }

@keyframes hubFloat {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-8px); }
}
@keyframes float {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-10px); }
}
</style>
</svg>
