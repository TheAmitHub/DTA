
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" fill="none">
<defs>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#C084FC"/>
    <stop offset="1" stop-color="#6B21A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#9333EA"/>
    <stop offset="1" stop-color="#4C1D95"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F0E7FF"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F0ABFC"/>
    <stop offset="1" stop-color="#9333EA"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#55218A" flood-opacity=".17"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<!-- Background -->
<ellipse cx="340" cy="280" rx="250" ry="205" fill="#DCC5FF" opacity=".38" filter="url(#glow)"/>
<circle cx="340" cy="275" r="215" stroke="#C4A3F5" stroke-width="1.5" stroke-dasharray="5 10" opacity=".7"/>
<circle cx="340" cy="275" r="165" stroke="#D8B4FE" stroke-dasharray="3 9" opacity=".6"/>

<!-- Orbit dots -->
<g fill="#9333EA">
  <circle cx="110" cy="145" r="5"/>
  <circle cx="565" cy="140" r="5"/>
  <circle cx="570" cy="390" r="6"/>
  <circle cx="105" cy="390" r="4"/>
  <circle cx="340" cy="55" r="4"/>
</g>

<!-- Central writing workspace -->
<g class="workspace" filter="url(#shadow)">
  <rect x="210" y="150" width="260" height="260" rx="28" fill="#2E1065"/>
  <rect x="221" y="161" width="238" height="238" rx="20" fill="url(#paper)"/>

  <!-- Header -->
  <rect x="241" y="180" width="198" height="38" rx="11" fill="#F1E8FF"/>
  <circle cx="259" cy="199" r="9" fill="url(#purple)"/>
  <path d="M255 199L258 202L264 195" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="276" y="203" font-size="11" font-weight="700" fill="#4C1D95">CONTENT STUDIO</text>

  <!-- Document heading -->
  <rect x="244" y="240" width="130" height="10" rx="5" fill="#7E22CE"/>
  <rect x="244" y="259" width="172" height="7" rx="3.5" fill="#C4B5FD"/>
  <rect x="244" y="274" width="155" height="7" rx="3.5" fill="#DDD0F5"/>

  <!-- Text lines -->
  <g fill="#D8C9ED">
    <rect x="244" y="302" width="170" height="6" rx="3"/>
    <rect x="244" y="316" width="153" height="6" rx="3"/>
    <rect x="244" y="330" width="164" height="6" rx="3"/>
  </g>

  <!-- Writing highlight -->
  <rect x="244" y="350" width="190" height="29" rx="8" fill="#EDE3FF"/>
  <rect x="255" y="361" width="120" height="6" rx="3" fill="#A78BFA"/>
</g>

<!-- Blog writing card -->
<g class="blog" filter="url(#shadow)">
  <rect x="35" y="65" width="180" height="112" rx="19" fill="white"/>
  <circle cx="65" cy="97" r="20" fill="#F3E8FF"/>
  <path d="M57 84H68L75 91V109H57Z" fill="url(#purple)"/>
  <path d="M68 84V92H75" stroke="white" stroke-width="1.5"/>
  <path d="M61 98H71M61 103H70" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="94" y="94" font-size="12" font-weight="700" fill="#4C1D95">BLOG</text>
  <text x="94" y="110" font-size="12" font-weight="700" fill="#4C1D95">WRITING</text>
  <rect x="55" y="139" width="135" height="5" rx="2.5" fill="#E9D5FF"/>
  <rect x="55" y="151" width="100" height="5" rx="2.5" fill="#DDD0F5"/>
</g>

<!-- Website content card -->
<g class="website" filter="url(#shadow)">
  <rect x="465" y="65" width="180" height="112" rx="19" fill="white"/>
  <circle cx="495" cy="97" r="20" fill="#EDE3FF"/>
  <rect x="483" y="87" width="25" height="20" rx="4" fill="url(#purple)"/>
  <path d="M483 93H508" stroke="white" stroke-width="2"/>
  <circle cx="488" cy="90" r="1.3" fill="white"/>
  <circle cx="493" cy="90" r="1.3" fill="white"/>
  <path d="M488 99H502M488 103H499" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="523" y="94" font-size="11" font-weight="700" fill="#4C1D95">WEBSITE</text>
  <text x="523" y="109" font-size="11" font-weight="700" fill="#4C1D95">CONTENT</text>
  <rect x="485" y="139" width="135" height="5" rx="2.5" fill="#E9D5FF"/>
  <rect x="485" y="151" width="100" height="5" rx="2.5" fill="#DDD0F5"/>
</g>

<!-- YouTube description card -->
<g class="youtube" filter="url(#shadow)">
  <rect x="15" y="235" width="180" height="112" rx="19" fill="white"/>
  <circle cx="49" cy="270" r="22" fill="#FEE2E2"/>
  <rect x="32" y="258" width="34" height="24" rx="7" fill="#EF4444"/>
  <path d="M46 264L56 270L46 276Z" fill="white"/>
  <text x="80" y="267" font-size="11" font-weight="700" fill="#4C1D95">YOUTUBE</text>
  <text x="80" y="283" font-size="11" font-weight="700" fill="#4C1D95">DESCRIPTION</text>
  <rect x="34" y="309" width="135" height="5" rx="2.5" fill="#E9D5FF"/>
  <rect x="34" y="321" width="100" height="5" rx="2.5" fill="#DDD0F5"/>
</g>

<!-- PR writing card -->
<g class="pr" filter="url(#shadow)">
  <rect x="485" y="235" width="180" height="112" rx="19" fill="white"/>
  <circle cx="518" cy="270" r="22" fill="#F3E8FF"/>
  <path d="M505 263H530V280H505Z" fill="url(#purple)"/>
  <path d="M510 267H525M510 272H523M510 277H519" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="550" y="267" font-size="12" font-weight="700" fill="#4C1D95">PR</text>
  <text x="550" y="283" font-size="12" font-weight="700" fill="#4C1D95">WRITING</text>
  <rect x="505" y="309" width="135" height="5" rx="2.5" fill="#E9D5FF"/>
  <rect x="505" y="321" width="100" height="5" rx="2.5" fill="#DDD0F5"/>
</g>

<!-- Caption writing card -->
<g class="caption" filter="url(#shadow)">
  <rect x="245" y="430" width="190" height="100" rx="19" fill="white"/>
  <circle cx="280" cy="465" r="21" fill="#F3E8FF"/>
  <path d="M266 455H294V472H279L271 479V472H266Z" fill="url(#purple)"/>
  <path d="M273 461H287M273 466H284" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="313" y="463" font-size="11" font-weight="700" fill="#4C1D95">SOCIAL MEDIA</text>
  <text x="313" y="479" font-size="11" font-weight="700" fill="#4C1D95">CAPTIONS</text>
  <rect x="266" y="497" width="148" height="5" rx="2.5" fill="#E9D5FF"/>
</g>

<!-- Floating pen -->
<g class="pen" filter="url(#shadow)" transform="rotate(-40 470 390)">
  <rect x="460" y="355" width="19" height="90" rx="9" fill="url(#deep)"/>
  <rect x="464" y="365" width="11" height="62" rx="4" fill="#C084FC"/>
  <path d="M460 438L469.5 465L479 438Z" fill="#6B21A8"/>
  <path d="M466 454L469.5 465L473 454Z" fill="#F3E8FF"/>
</g>

<!-- Sparkles -->
<g fill="#9333EA">
  <path d="M290 65L296 83L314 89L296 95L290 113L284 95L266 89L284 83Z"/>
  <path d="M570 185L575 199L589 204L575 209L570 223L565 209L551 204L565 199Z"/>
  <path d="M110 420L115 434L129 439L115 444L110 458L105 444L91 439L105 434Z"/>
</g>

<style>
.workspace { animation: mainFloat 4.5s ease-in-out infinite; transform-origin:center; }
.blog { animation: float 4s ease-in-out infinite -1s; }
.website { animation: float 4.5s ease-in-out infinite -2s; }
.youtube { animation: float 4.2s ease-in-out infinite -1.5s; }
.pr { animation: float 4.5s ease-in-out infinite -.5s; }
.caption { animation: float 4s ease-in-out infinite -2.5s; }
.pen { animation: write 3.5s ease-in-out infinite; transform-origin:center; }
@keyframes mainFloat {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-7px); }
}
@keyframes float {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-10px); }
}
@keyframes write {
  0%,100% { transform:translate(0,0) rotate(-40deg); }
  50% { transform:translate(-5px,7px) rotate(-35deg); }
}
</style>
</svg>
