<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Purple Gradients -->
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="neonCurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181324" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e0a17" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="docInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c152b" />
      <stop offset="100%" stop-color="#120c1d" />
    </linearGradient>

    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="shadowFilter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4c1d95" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Light -->
  <circle cx="370" cy="240" r="150" fill="url(#blogGrad)" opacity="0.25" filter="url(#ambientGlow)" />

  <!-- Outer Console Board -->
  <rect x="35" y="25" width="670" height="430" rx="26" fill="url(#cardSurface)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.32" />

  <!-- Top Header Row -->
  <g transform="translate(65, 55)">
    <circle cx="6" cy="12" r="5" fill="#a78bfa" />
    <circle cx="6" cy="12" r="10" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" stroke-dasharray="2 3" />
    <text x="26" y="17" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-weight="800" font-size="19" letter-spacing="1.2">WORK UPDATES &amp; SERVICE FEEDBACK</text>
    <text x="26" y="38" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-weight="600" font-size="12" letter-spacing="1">Insights, project releases and client case studies</text>
  </g>

  <!-- CENTER SCREEN: RICH CASE STUDY & EDITORIAL CANVAS -->
  <g transform="translate(180, 110)" filter="url(#shadowFilter)">
    <!-- Main Device/Screen Container -->
    <rect width="380" height="245" rx="18" fill="url(#docInner)" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.5" />
    
    <!-- Top Action Bar (Browser/Article Header) -->
    <rect x="0" y="0" width="380" height="34" rx="18" fill="#140e21" />
    <circle cx="20" cy="17" r="4" fill="#8b5cf6" />
    <circle cx="32" cy="17" r="4" fill="#6d28d9" />
    <circle cx="44" cy="17" r="4" fill="#4c1d95" />
    <!-- Live Article Status Pill -->
    <rect x="70" y="9" width="115" height="16" rx="8" fill="#221838" />
    <text x="127" y="21" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-weight="700" font-size="9" text-anchor="middle">CASE STUDY · 4 MIN</text>

    <!-- CONTENT BODY: 2-Column Story Layout -->
    <!-- Left Column: Visual Media Snapshot / Video Ad Thumbnail -->
    <g transform="translate(20, 50)">
      <rect width="115" height="115" rx="12" fill="#23173d" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
      <!-- Thumbnail Video Mesh -->
      <circle cx="57" cy="52" r="18" fill="#150d26" stroke="#8b5cf6" stroke-width="1" />
      <polygon points="54,46 54,58 64,52" fill="#a78bfa" />
      <!-- Mini Hook Line Inside Thumbnail -->
      <path d="M12 95 Q 40 70, 70 85 T 103 65" stroke="url(#neonCurve)" stroke-width="2" fill="none" stroke-linecap="round" />
      <rect x="12" y="15" width="45" height="6" rx="3" fill="#8b5cf6" opacity="0.6" />
    </g>

    <!-- Right Column: Editorial Headings & Live Copy -->
    <g transform="translate(150, 52)">
      <!-- Main Blog Title -->
      <line x1="0" y1="10" x2="200" y2="10" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <line x1="0" y1="24" x2="160" y2="24" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <!-- Subheading / Context -->
      <line x1="0" y1="44" x2="130" y2="44" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.85" />
      <!-- Body Copy Lines -->
      <line x1="0" y1="64" x2="210" y2="64" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
      <line x1="0" y1="78" x2="190" y2="78" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
      <line x1="0" y1="92" x2="150" y2="92" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Bottom Result Chips (Feedback & Impact Proof) -->
    <g transform="translate(20, 180)">
      <rect width="340" height="48" rx="10" fill="#150e24" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.3" />
      
      <!-- Metric Chip 1 -->
      <rect x="12" y="11" width="95" height="26" rx="6" fill="#251740" />
      <text x="59" y="27" fill="#a78bfa" font-family="'Manrope', sans-serif" font-weight="800" font-size="10" text-anchor="middle">▲ +340% REACH</text>

      <!-- Metric Chip 2 -->
      <rect x="115" y="11" width="105" height="26" rx="6" fill="#251740" />
      <text x="167" y="27" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-weight="700" font-size="10" text-anchor="middle">✓ CLIENT TESTED</text>

      <!-- Read Action -->
      <text x="310" y="28" fill="#ffffff" font-family="'Manrope', sans-serif" font-weight="800" font-size="11" text-anchor="middle">READ →</text>
    </g>
  </g>

  <!-- Left Floating Card: Service Feedback Node -->
  <g transform="translate(55, 220)" filter="url(#shadowFilter)">
    <rect width="145" height="90" rx="14" fill="#161025" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="26" cy="28" r="9" fill="#6d28d9" />
    <text x="26" y="32" fill="#ffffff" font-family="'Manrope', sans-serif" font-weight="900" font-size="10" text-anchor="middle">★</text>
    <text x="42" y="31" fill="#ffffff" font-family="'Manrope', sans-serif" font-weight="700" font-size="11">Client Review</text>
    <text x="16" y="55" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-weight="700" font-size="12">"Exceeded ROAS"</text>
    <text x="16" y="72" fill="#8b5cf6" font-family="'Manrope', sans-serif" font-weight="600" font-size="10">Verified Partner</text>
  </g>

  <!-- Right Floating Card: Live Articles Count -->
  <g transform="translate(540, 250)" filter="url(#shadowFilter)">
    <rect width="140" height="85" rx="14" fill="#161025" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="16" y="28" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-weight="700" font-size="10" letter-spacing="1">MEDIUM PUB</text>
    <text x="16" y="52" fill="#ffffff" font-family="'Manrope', sans-serif" font-weight="800" font-size="17">Live Case</text>
    <text x="16" y="70" fill="#a78bfa" font-family="'Manrope', sans-serif" font-weight="700" font-size="10">Direct Reader Flow</text>
  </g>
</svg>
