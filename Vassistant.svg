
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
<defs>
  <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#B66AFF"/><stop offset="1" stop-color="#5B21B6"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0E7FF"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#7E22CE"/><stop offset="1" stop-color="#3B0764"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#55218A" flood-opacity=".2"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
</defs>

<!-- Soft background -->
<ellipse cx="320" cy="280" rx="230" ry="190" fill="#DCC5FF" opacity=".38" filter="url(#glow)"/>
<circle cx="320" cy="260" r="205" stroke="#C4A3F5" stroke-dasharray="5 10" opacity=".7"/>

<!-- Orbit -->
<g fill="#9333EA">
  <circle cx="125" cy="145" r="5"/>
  <circle cx="510" cy="120" r="6"/>
  <circle cx="530" cy="370" r="5"/>
  <circle cx="145" cy="390" r="4"/>
</g>

<!-- Laptop screen -->
<g class="laptop" filter="url(#shadow)">
  <rect x="145" y="120" width="350" height="250" rx="23" fill="#2E1065"/>
  <rect x="157" y="132" width="326" height="226" rx="15" fill="url(#screen)"/>

  <!-- Dashboard header -->
  <rect x="175" y="150" width="290" height="38" rx="10" fill="#F1E8FF"/>
  <circle cx="193" cy="169" r="8" fill="url(#p)"/>
  <text x="209" y="173" font-size="12" font-weight="700" fill="#4C1D95">DTA ASSISTANT</text>
  <circle cx="443" cy="169" r="5" fill="#22C55E"/>

  <!-- Dashboard sidebar -->
  <rect x="175" y="199" width="78" height="140" rx="9" fill="#F3ECFF"/>
  <g fill="#A78BFA">
    <rect x="188" y="216" width="48" height="7" rx="3"/>
    <rect x="188" y="238" width="38" height="6" rx="3"/>
    <rect x="188" y="260" width="43" height="6" rx="3"/>
    <rect x="188" y="282" width="34" height="6" rx="3"/>
    <rect x="188" y="304" width="42" height="6" rx="3"/>
  </g>

  <!-- Main task area -->
  <rect x="267" y="199" width="198" height="140" rx="10" fill="#FFFFFF"/>
  <text x="281" y="220" font-size="11" font-weight="700" fill="#4C1D95">Today's Tasks</text>

  <g>
    <rect x="280" y="232" width="172" height="27" rx="7" fill="#F5F0FF"/>
    <circle cx="294" cy="245" r="6" fill="#8B5CF6"/>
    <path d="M291 245L293 247L297 242" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="307" y="242" width="87" height="6" rx="3" fill="#C4B5FD"/>

    <rect x="280" y="266" width="172" height="27" rx="7" fill="#F5F0FF"/>
    <circle cx="294" cy="279" r="6" fill="#8B5CF6"/>
    <path d="M291 279L293 281L297 276" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="307" y="276" width="105" height="6" rx="3" fill="#C4B5FD"/>

    <rect x="280" y="300" width="172" height="27" rx="7" fill="#F5F0FF"/>
    <circle cx="294" cy="313" r="6" fill="#D8B4FE"/>
    <rect x="307" y="310" width="75" height="6" rx="3" fill="#DDD0F5"/>
  </g>
</g>

<!-- Laptop base -->
<g filter="url(#shadow)">
  <path d="M125 371H515L542 391Q545 400 529 402H110Q94 400 99 391L125 371Z" fill="url(#dark)"/>
  <path d="M125 371H515L530 390H110L125 371Z" fill="#A855F7"/>
  <path d="M275 377H365L355 384H285Z" fill="#E9D5FF" opacity=".8"/>
</g>

<!-- Assistant avatar card -->
<g class="avatar" filter="url(#shadow)">
  <rect x="35" y="205" width="125" height="145" rx="22" fill="white"/>
  <circle cx="97" cy="260" r="37" fill="#EDE3FF"/>
  <circle cx="97" cy="250" r="19" fill="#F2C6A5"/>
  <path d="M78 249Q77 225 98 226Q119 227 117 251L111 243Q98 238 83 247Z" fill="#3B2455"/>
  <path d="M77 251Q69 239 76 230Q85 218 99 220Q119 221 120 240L114 247Q110 232 96 232Q84 232 77 251Z" fill="#3B2455"/>
  <path d="M66 300Q70 272 97 272Q124 272 129 300Z" fill="url(#p)"/>
  <circle cx="90" cy="252" r="2" fill="#3B2455"/>
  <circle cx="105" cy="252" r="2" fill="#3B2455"/>
  <path d="M92 261Q97 265 103 261" stroke="#A65D57" stroke-width="1.7" stroke-linecap="round"/>
  <text x="97" y="327" text-anchor="middle" font-size="10" font-weight="700" fill="#4C1D95">YOUR ASSISTANT</text>
</g>

<!-- Floating calendar card -->
<g class="calendar" filter="url(#shadow)">
  <rect x="475" y="65" width="112" height="105" rx="18" fill="white"/>
  <rect x="475" y="65" width="112" height="31" rx="18" fill="url(#p)"/>
  <path d="M475 82V96H587V82" fill="url(#p)"/>
  <text x="531" y="85" text-anchor="middle" font-size="10" font-weight="700" fill="white">SCHEDULE</text>
  <g fill="#A78BFA">
    <rect x="491" y="108" width="15" height="13" rx="3"/>
    <rect x="512" y="108" width="15" height="13" rx="3"/>
    <rect x="533" y="108" width="15" height="13" rx="3"/>
    <rect x="554" y="108" width="15" height="13" rx="3"/>
  </g>
  <g fill="#7E22CE">
    <rect x="491" y="128" width="15" height="13" rx="3"/>
    <rect x="512" y="128" width="15" height="13" rx="3"/>
    <rect x="533" y="128" width="15" height="13" rx="3"/>
    <rect x="554" y="128" width="15" height="13" rx="3"/>
  </g>
</g>

<!-- Chat notification -->
<g class="chat" filter="url(#shadow)">
  <rect x="455" y="225" width="145" height="85" rx="18" fill="white"/>
  <circle cx="477" cy="248" r="10" fill="url(#p)"/>
  <path d="M473 248H481M477 244V252" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <rect x="494" y="243" width="85" height="7" rx="3.5" fill="#C4B5FD"/>
  <rect x="474" y="267" width="105" height="6" rx="3" fill="#E9D5FF"/>
  <rect x="474" y="282" width="75" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Email icon -->
<g class="email" filter="url(#shadow)">
  <circle cx="105" cy="115" r="34" fill="url(#p)"/>
  <rect x="85" y="103" width="40" height="26" rx="5" fill="white"/>
  <path d="M86 106L105 120L124 106" stroke="#7E22CE" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Decorative sparkles -->
<g fill="#9333EA">
  <path d="M210 65L216 83L234 89L216 95L210 113L204 95L186 89L204 83Z"/>
  <path d="M550 195L555 208L568 213L555 218L550 231L545 218L532 213L545 208Z"/>
  <path d="M80 390L85 403L98 408L85 413L80 426L75 413L62 408L75 403Z"/>
</g>

<style>
  .laptop { animation: laptopFloat 4s ease-in-out infinite; transform-origin: center; }
  .avatar { animation: avatarFloat 4.5s ease-in-out infinite -1s; }
  .calendar { animation: avatarFloat 4s ease-in-out infinite -2s; }
  .chat { animation: avatarFloat 4.5s ease-in-out infinite -1.5s; }
  .email { animation: avatarFloat 4s ease-in-out infinite -.5s; }
  @keyframes laptopFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes avatarFloat {
    0%,100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }
</style>
</svg>
