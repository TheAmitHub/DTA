<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Purple Gradients -->
    <linearGradient id="raPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="raNeonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="raGlassBoard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181324" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e0a17" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="cameraBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241b36" />
      <stop offset="100%" stop-color="#130e1f" />
    </linearGradient>

    <!-- Deep Ambient Glow & Shadow Filters -->
    <filter id="raAmbient" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
    <filter id="raDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#4c1d95" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Atmospheric Lighting -->
  <circle cx="370" cy="250" r="160" fill="url(#raPurpleGrad)" opacity="0.30" filter="url(#raAmbient)" />
  <circle cx="560" cy="180" r="110" fill="#8b5cf6" opacity="0.18" filter="url(#raAmbient)" />

  <!-- Orbiting Motion Curves -->
  <ellipse cx="370" cy="260" rx="320" ry="140" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.25" transform="rotate(-6 370 260)" />

  <!-- MAIN CONSOLE BOARD (Clean Glass Frame) -->
  <rect x="35" y="25" width="670" height="450" rx="28" fill="url(#raGlassBoard)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.32" />

  <!-- MINIMAL CONSOLE HEADER -->
  <g transform="translate(65, 55)">
    <circle cx="6" cy="12" r="5" fill="#a78bfa" />
    <circle cx="6" cy="12" r="10" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" stroke-dasharray="2 3" />
    <text x="26" y="17" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="1.2">CREATIVE AD &amp; PRODUCTION HUB</text>
    <text x="26" y="38" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-weight="600" font-size="12" letter-spacing="1">High-retention reels, brand production &amp; paid campaigns</text>
  </g>

  <!-- DIGITAL CINEMA CAMERA (Brand Shoot Setup - Left Angle) -->
  <g id="cinema-camera" transform="translate(75, 170)" filter="url(#raDropShadow)">
    <!-- Tripod Base / Mount Stand -->
    <path d="M70 170 L40 250" stroke="#251b38" stroke-width="6" stroke-linecap="round" />
    <path d="M100 170 L130 250" stroke="#251b38" stroke-width="6" stroke-linecap="round" />
    <rect x="62" y="160" width="46" height="14" rx="4" fill="#36284f" />

    <!-- Main Camera Chassis -->
    <rect x="30" y="55" width="110" height="110" rx="16" fill="url(#cameraBody)" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.5" />
    
    <!-- Top Handle Rig -->
    <path d="M50 55 L50 30 L120 30 L120 55" stroke="#8b5cf6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Cinema Lens Mount Ring -->
    <circle cx="85" cy="110" r="38" fill="#0c0816" stroke="#8b5cf6" stroke-width="2.5" />
    <circle cx="85" cy="110" r="28" fill="#1b122c" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="85" cy="110" r="14" fill="url(#raPurpleGrad)" />
    <!-- Lens Light Reflection -->
    <path d="M78 102 C82 96, 92 96, 96 102" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Live Recording Tally Indicator (Brand Shoot Active) -->
    <circle cx="124" cy="72" r="5" fill="#ef4444" />
    <circle cx="124" cy="72" r="9" stroke="#ef4444" stroke-width="1" opacity="0.6" stroke-dasharray="2 2" />

    <!-- Camera Mic / Matte Box Accent -->
    <rect x="135" y="90" width="22" height="40" rx="4" fill="#1b1328" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- VERTICAL REEL & YOUTUBE SHORTS SCREEN (Center Frame 9:16) -->
  <g id="reels-frame" transform="translate(285, 115)" filter="url(#raDropShadow)">
    <!-- Smartphone Bezel -->
    <rect width="170" height="330" rx="24" fill="#130e20" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Video Preview Viewport -->
    <rect x="10" y="14" width="150" height="302" rx="16" fill="#1e162f" />

    <!-- Video Visual Graphic / Gradient Background -->
    <rect x="10" y="14" width="150" height="302" rx="16" fill="url(#raPurpleGrad)" opacity="0.35" />

    <!-- Center Play Action Button -->
    <circle cx="85" cy="145" r="24" fill="#0f0a1a" stroke="#8b5cf6" stroke-width="1.5" />
    <polygon points="80,135 80,155 96,145" fill="#ffffff" />

    <!-- Retention Curve Indicator Overlay -->
    <path d="M22 225 C45 220, 75 195, 110 205 L148 185" stroke="url(#raNeonGlow)" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="148" cy="185" r="4" fill="#ffffff" />

    <!-- Right Rail Social Action Indicators (Likes, Comments, Shares) -->
    <g transform="translate(136, 110)">
      <circle cx="10" cy="10" r="8" fill="#140d24" />
      <path d="M7 9 C7 7, 10 6, 10 9 C10 11, 7 13, 7 13 C7 13, 4 11, 4 9 C4 7, 7 6, 7 9 Z" fill="#a78bfa" />
      <circle cx="10" cy="34" r="8" fill="#140d24" />
      <rect x="6" y="31" width="8" height="6" rx="2" fill="#c4b5fd" />
      <circle cx="10" cy="58" r="8" fill="#140d24" />
      <polygon points="7,55 13,58 7,61" fill="#ffffff" />
    </g>

    <!-- Bottom Audio & Caption Scrubber -->
    <rect x="22" y="275" width="80" height="6" rx="3" fill="#ffffff" opacity="0.85" />
    <rect x="22" y="287" width="55" height="5" rx="2.5" fill="#8b5cf6" opacity="0.6" />
    <!-- Progress Timeline Scrubber Bar -->
    <line x1="22" y1="305" x2="148" y2="305" stroke="#382856" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="305" x2="90" y2="305" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="90" cy="305" r="3.5" fill="#ffffff" />
  </g>

  <!-- FLOATING CARD RIGHT: PAID AD ROAS METRIC -->
  <g transform="translate(520, 140)" filter="url(#raDropShadow)">
    <rect width="155" height="95" rx="16" fill="#151022" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="18" y="28" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-weight="700" font-size="10" letter-spacing="1">PAID CAMPAIGNS</text>
    <text x="18" y="55" fill="#ffffff" font-family="'Manrope', sans-serif" font-weight="800" font-size="20">4.8x ROAS</text>
    <text x="18" y="76" fill="#a78bfa" font-family="'Manrope', sans-serif" font-weight="700" font-size="11">▲ High Conversion</text>
  </g>

  <!-- FLOATING CARD BOTTOM RIGHT: MULTI-FORMAT BADGE -->
  <g transform="translate(515, 290)" filter="url(#raDropShadow)">
    <rect width="165" height="75" rx="16" fill="#191228" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="28" cy="26" r="10" fill="#6d28d9" />
    <!-- Video Reel Film Notch -->
    <polygon points="26,22 26,30 32,26" fill="#ffffff" />
    <text x="46" y="24" fill="#ffffff" font-family="'Manrope', sans-serif" font-weight="700" font-size="11">Reels &amp; Shorts</text>
    <text x="46" y="38" fill="#a78bfa" font-family="'Manrope', sans-serif" font-weight="600" font-size="10">High-Hook Retention</text>
    <line x1="20" y1="56" x2="145" y2="56" stroke="url(#raNeonGlow)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
