
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" fill="none">
<defs>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#C084FC"/><stop offset="1" stop-color="#6B21A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#9333EA"/><stop offset="1" stop-color="#4C1D95"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0E7FF"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#55218A" flood-opacity=".18"/>
  </filter>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<!-- Background -->
<ellipse cx="340" cy="280" rx="250" ry="205" fill="#DCC5FF" opacity=".38" filter="url(#glow)"/>
<circle cx="340" cy="275" r="215" stroke="#C4A3F5" stroke-dasharray="5 10" opacity=".7"/>

<!-- Orbit dots -->
<g fill="#9333EA">
  <circle cx="105" cy="145" r="5"/>
  <circle cx="570" cy="145" r="5"/>
  <circle cx="575" cy="390" r="6"/>
  <circle cx="105" cy="390" r="4"/>
  <circle cx="340" cy="55" r="4"/>
</g>

<!-- Central SEO dashboard -->
<g class="dashboard" filter="url(#shadow)">
  <rect x="210" y="155" width="260" height="260" rx="25" fill="#2E1065"/>
  <rect x="221" y="166" width="238" height="238" rx="17" fill="url(#paper)"/>

  <!-- Browser header -->
  <rect x="221" y="166" width="238" height="38" rx="15" fill="url(#deep)"/>
  <circle cx="240" cy="185" r="5" fill="#FCA5A5"/>
  <circle cx="256" cy="185" r="5" fill="#FDE68A"/>
  <circle cx="272" cy="185" r="5" fill="#86EFAC"/>

  <!-- Search bar -->
  <rect x="240" y="219" width="200" height="34" rx="10" fill="#FFFFFF" stroke="#E9D5FF"/>
  <text x="253" y="241" font-size="12" fill="#A78BFA">Search keywords...</text>
  <circle cx="418" cy="236" r="8" stroke="#7E22CE" stroke-width="2.5"/>
  <path d="M424 242L430 248" stroke="#7E22CE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- SEO letters -->
  <text x="246" y="325" font-size="66" font-weight="900" letter-spacing="-4" fill="url(#deep)">SEO</text>
  <path d="M248 342H424" stroke="#D8B4FE" stroke-width="6" stroke-linecap="round"/>
  <path d="M248 358H390" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M248 374H350" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- Laptop base -->
<g filter="url(#shadow)">
  <path d="M195 415H485L506 433Q510 442 493 444H187Q170 442 175 433L195 415Z" fill="url(#deep)"/>
  <path d="M195 415H485L497 432H183Z" fill="#A855F7"/>
  <path d="M290 419H390L379 427H301Z" fill="#E9D5FF" opacity=".8"/>
</g>

<!-- Keyword Research card -->
<g class="keyword" filter="url(#shadow)">
  <rect x="25" y="65" width="190" height="115" rx="19" fill="white"/>
  <circle cx="62" cy="105" r="23" fill="#F3E8FF"/>
  <circle cx="59" cy="101" r="11" stroke="#7E22CE" stroke-width="4"/>
  <path d="M67 109L78 120" stroke="#7E22CE" stroke-width="5" stroke-linecap="round"/>
  <text x="94" y="100" font-size="12" font-weight="700" fill="#4C1D95">KEYWORD</text>
  <text x="94" y="116" font-size="12" font-weight="700" fill="#4C1D95">RESEARCH</text>
  <rect x="48" y="145" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="48" y="158" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- On Page SEO card -->
<g class="onpage" filter="url(#shadow)">
  <rect x="465" y="65" width="190" height="115" rx="19" fill="white"/>
  <circle cx="502" cy="105" r="23" fill="#F3E8FF"/>
  <rect x="490" y="92" width="25" height="26" rx="4" fill="url(#purple)"/>
  <path d="M496 100L500 104L508 96M496 111H508" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="535" y="100" font-size="12" font-weight="700" fill="#4C1D95">ON-PAGE</text>
  <text x="535" y="116" font-size="12" font-weight="700" fill="#4C1D95">SEO</text>
  <rect x="488" y="145" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="488" y="158" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Off Page SEO card -->
<g class="offpage" filter="url(#shadow)">
  <rect x="20" y="250" width="190" height="115" rx="19" fill="white"/>
  <circle cx="59" cy="290" r="23" fill="#F3E8FF"/>
  <circle cx="52" cy="284" r="6" fill="#9333EA"/>
  <circle cx="67" cy="284" r="6" fill="#9333EA"/>
  <circle cx="59" cy="301" r="6" fill="#9333EA"/>
  <path d="M55 284L64 284M54 289L58 296M65 289L61 296" stroke="#7E22CE" stroke-width="2"/>
  <text x="92" y="285" font-size="12" font-weight="700" fill="#4C1D95">OFF-PAGE</text>
  <text x="92" y="301" font-size="12" font-weight="700" fill="#4C1D95">SEO</text>
  <rect x="43" y="330" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="43" y="343" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Website Audit card -->
<g class="audit" filter="url(#shadow)">
  <rect x="470" y="250" width="190" height="115" rx="19" fill="white"/>
  <circle cx="509" cy="290" r="23" fill="#F3E8FF"/>
  <rect x="497" y="276" width="24" height="30" rx="4" fill="url(#purple)"/>
  <path d="M502 284L505 287L510 281M513 285H517M502 296L505 299L510 293M513 297H517" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="520" cy="303" r="10" fill="url(#green)"/>
  <path d="M515 303L519 307L526 299" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="545" y="285" font-size="12" font-weight="700" fill="#4C1D95">WEBSITE</text>
  <text x="545" y="301" font-size="12" font-weight="700" fill="#4C1D95">AUDIT</text>
  <rect x="493" y="330" width="145" height="6" rx="3" fill="#C4B5FD"/>
  <rect x="493" y="343" width="105" height="6" rx="3" fill="#E9D5FF"/>
</g>

<!-- Growth chart floating card -->
<g class="growth" filter="url(#shadow)">
  <rect x="250" y="455" width="180" height="85" rx="18" fill="white"/>
  <text x="270" y="479" font-size="11" font-weight="700" fill="#4C1D95">SEO GROWTH</text>
  <g fill="url(#purple)">
    <rect x="272" y="507" width="17" height="17" rx="4"/>
    <rect x="300" y="497" width="17" height="27" rx="4"/>
    <rect x="328" y="487" width="17" height="37" rx="4"/>
    <rect x="356" y="475" width="17" height="49" rx="4"/>
  </g>
  <path d="M377 485L394 468L407 475" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 467L407 475L396 478" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Magnifying glass -->
<g class="magnify" filter="url(#shadow)">
  <circle cx="448" cy="405" r="31" fill="url(#purple)"/>
  <circle cx="448" cy="405" r="20" fill="#F8F3FF" stroke="#7E22CE" stroke-width="4"/>
  <path d="M470 428L493 451" stroke="#6B21A8" stroke-width="11" stroke-linecap="round"/>
  <path d="M439 406L446 413L459 396" stroke="#9333EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Upward growth arrow -->
<g class="arrow">
  <path d="M405 390Q450 365 477 330" stroke="#A855F7" stroke-width="9" stroke-linecap="round"/>
  <path d="M459 331L481 325L479 348" stroke="#A855F7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Sparkles -->
<g fill="#9333EA">
  <path d="M275 60L281 78L299 84L281 90L275 108L269 90L251 84L269 78Z"/>
  <path d="M570 200L575 214L589 219L575 224L570 238L565 224L551 219L565 214Z"/>
  <path d="M115 420L120 434L134 439L120 444L115 458L110 444L96 439L110 434Z"/>
</g>

<style>
.dashboard { animation: mainFloat 4.5s ease-in-out infinite; transform-origin:center; }
.keyword { animation: float 4s ease-in-out infinite -1s; }
.onpage { animation: float 4.5s ease-in-out infinite -2s; }
.offpage { animation: float 4.2s ease-in-out infinite -1.5s; }
.audit { animation: float 4.5s ease-in-out infinite -.5s; }
.growth { animation: float 4s ease-in-out infinite -2.5s; }
.magnify { animation: magnify 4s ease-in-out infinite; transform-origin:center; }
.arrow { animation: arrowGlow 2.5s ease-in-out infinite; }
@keyframes mainFloat {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-7px); }
}
@keyframes float {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-10px); }
}
@keyframes magnify {
  0%,100% { transform:translateY(0) rotate(0); }
  50% { transform:translateY(-8px) rotate(5deg); }
}
@keyframes arrowGlow {
  0%,100% { opacity:.65; }
  50% { opacity:1; }
}
</style>
</svg>
