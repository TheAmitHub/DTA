<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTA Support - Admin Panel</title>
    <style>
        :root {
            --bg: #f5faf6;
            --surface: #ffffff;
            --surface-soft: #edf6ef;
            --text: #18291f;
            --muted: #65756a;
            --green: #23834d;
            --green-dark: #17663a;
            --green-light: #dff2e4;
            --border: #dce8de;
            --shadow: 0 12px 35px rgba(26, 70, 42, 0.08);
            --radius: 20px;
        }

        [data-theme="dark"] {
            --bg: #0d1410;
            --surface: #132219;
            --surface-soft: #1a2f23;
            --text: #e2ede5;
            --muted: #94b09d;
            --green: #2ecc71;
            --green-dark: #27ae60;
            --green-light: #163824;
            --border: #244231;
            --shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            font-size: 18px;
            z-index: 10;
        }

        .theme-toggle:hover {
            border-color: var(--green);
        }

        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(24, 41, 31, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .login-card h3 {
            color: var(--text);
            margin-bottom: 10px;
        }

        .login-card p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .admin-container {
            background: var(--surface);
            padding: 30px 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
            margin: 20px;
        }

        h2 {
            color: var(--text);
            margin-bottom: 25px;
            font-size: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--green);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--green-light);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            cursor: pointer;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--green);
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            color: var(--green-dark);
            font-weight: 600;
            cursor: pointer;
        }

        button.action-btn {
            width: 100%;
            background: var(--green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button.action-btn:hover {
            background: var(--green-dark);
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Switch Theme">🌙</button>

<!-- Secure Password Login Screen -->
<div id="loginOverlay">
    <div class="login-card">
        <h3>Admin Access</h3>
        <p>Enter secure password to continue</p>
        <div class="form-group">
            <input type="password" id="adminPassword" placeholder="Enter secure password">
        </div>
        <button class="action-btn" onclick="checkPassword()">Login</button>
        <p id="loginError" style="color: #e74c3c; font-size: 13px; margin-top: 12px;"></p>
    </div>
</div>

<!-- Admin Supporter Entry Panel -->
<div class="admin-container">
    <h2>Manage Supporter Data</h2>
    <form id="adminForm">
        
        <div class="checkbox-group" onclick="toggleAngel(event)">
            <input type="checkbox" id="isAngel" name="is_angel" onchange="fillAngelData()">
            <label for="isAngel">👼 Angel Supporter (Quick Support)</label>
        </div>

        <div class="form-group">
            <label>Supporter Name</label>
            <input type="text" id="supporterName" name="name" placeholder="Enter name (Optional)">
        </div>
        <div class="form-group">
            <label>Profession</label>
            <input type="text" id="supporterProf" name="profession" placeholder="e.g. Developer / Student">
        </div>
        <div class="form-group">
            <label>Contact Info</label>
            <input type="text" name="contact" placeholder="Email or Phone">
        </div>
        <div class="form-group">
            <label>Social Link</label>
            <input type="text" name="social" placeholder="Instagram / LinkedIn URL">
        </div>
        <div class="form-group">
            <label>Support Amount *</label>
            <input type="text" name="amount" placeholder="e.g. ₹500 or Custom" required>
        </div>
        <div class="form-group">
            <label>Message / Note</label>
            <textarea name="message" rows="3" placeholder="Optional message from supporter"></textarea>
        </div>
        <button type="submit" class="action-btn" id="submitBtn">Save to Database & Notify</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    const savedTheme = localStorage.getItem('dta_admin_theme') || 'light';
    if (savedTheme === 'dark') {
        htmlElement.setAttribute('data-theme', 'dark');
        themeToggleBtn.innerText = '☀️';
    }

    function toggleTheme() {
        const currentTheme = htmlElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            htmlElement.removeAttribute('data-theme');
            localStorage.setItem('dta_admin_theme', 'light');
            themeToggleBtn.innerText = '🌙';
        } else {
            htmlElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('dta_admin_theme', 'dark');
            themeToggleBtn.innerText = '☀️';
        }
    }

    // Backend Secure Password Verification
    async function checkPassword() {
        const pass = document.getElementById('adminPassword').value;
        const errorTag = document.getElementById('loginError');
        errorTag.innerText = 'Checking...';

        try {
            const response = await fetch('https://support-api.dtasocialwork.workers.dev/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                errorTag.innerText = 'Wrong Password! Try again.';
            }
        } catch (err) {
            errorTag.innerText = 'Network Error! Try again.';
        }
    }

    document.getElementById('adminPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkPassword();
    });

    function toggleAngel(e) {
        if(e.target.tagName !== 'INPUT') {
            const cb = document.getElementById('isAngel');
            cb.checked = !cb.checked;
            fillAngelData();
        }
    }

    function fillAngelData() {
        const isAngel = document.getElementById('isAngel').checked;
        const nameField = document.getElementById('supporterName');
        const profField = document.getElementById('supporterProf');

        if (isAngel) {
            nameField.value = "Angel Supporter";
            profField.value = "Anonymous Supporter";
        } else {
            nameField.value = "";
            profField.value = "";
        }
    }

    document.getElementById('adminForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        
        submitBtn.disabled = true;
        statusDiv.style.color = 'var(--green)';
        statusDiv.innerText = 'Saving data...';

        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('https://support-api.dtasocialwork.workers.dev/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                statusDiv.style.color = 'var(--green)';
                statusDiv.innerText = 'Success! Saved to Database & Email sent.';
                this.reset();
                document.getElementById('isAngel').checked = false;
            } else {
                statusDiv.style.color = '#e74c3c';
                statusDiv.innerText = 'Error: ' + (result.error || 'Failed to save');
            }
        } catch (err) {
            statusDiv.style.color = '#e74c3c';
            statusDiv.innerText = 'Network Error: ' + err.message;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
